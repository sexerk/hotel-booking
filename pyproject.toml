[tool.poetry]
name = "hotel-booking"
version = "0.1.0"
description = "Hotel booking system"
authors = ["Илья Муканов <horordai@gmail.com>"]
readme = "README.md"
packages = [
    { include = "hotel_project" }
]

[tool.poetry.dependencies]
python = "^3.12"
django = "^6.0.1"
djangorestframework = "^3.16.1"
psycopg2-binary = "^2.9.11"
pytest-django = "^4.11.1"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.9.6"
mypy = "^1.15.0"
pre-commit = "^3.7.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true